name: CodeQL

# Worth running on this codebase specifically, not as box-ticking: costingly
# executes model-authored SQL through the read-only query service and spawns
# initdb/pg_ctl with constructed arguments, so js/sql-injection and
# js/command-line-injection are exactly the queries that apply here.
#
# Not on pull_request. It is ~5 minutes for findings that are equally useful
# discovered on main, and PR latency is worth more than that.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      # No build step: CodeQL analyses TypeScript from source. Running `npm ci`
      # here would only add three minutes and a dist/ tree it does not read.
      - uses: github/codeql-action/analyze@v3
