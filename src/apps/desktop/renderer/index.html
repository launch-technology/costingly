<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <!--
      Only what Vite bundled may run or style this page. No inline scripts, no
      remote anything: a status screen has no reason to reach the network, and
      every string it shows came from somewhere else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Costingly</title>
    <!-- Linked here rather than imported from main.tsx: Vite bundles either, and
         this keeps the TypeScript side free of a CSS module declaration. -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="h-full bg-white text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
